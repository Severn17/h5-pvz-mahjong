<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>植物麻将 · 肉鸽塔防</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="canvas" width="1000" height="700"></canvas>

<!-- 顶部状态栏 -->
<div id="hud" class="hidden">
  <button id="shovelBtn" title="铲子（S）">⛏️</button>
  <div class="stage-box">
    <div class="stage-top"><span id="stageLabel"></span><span id="modChip" class="chip"></span></div>
    <div class="progress"><div id="progressFill"></div><span class="flag">🚩</span></div>
  </div>
  <button id="speedBtn" title="加速（F）">1×</button>
  <button id="muteBtn" title="静音（M）">🔊</button>
  <button id="pauseBtn" title="暂停（空格）">⏸</button>
</div>
<div id="relics" class="hidden"></div>
<div id="relicTip" class="tip hidden"></div>
<div id="cardTip" class="tip hidden"></div>
<div id="banner"></div>

<!-- 加载 -->
<div id="loading" class="overlay">
  <h1>植物麻将</h1>
  <div class="load-bar"><div id="loadFill"></div></div>
</div>
<!-- 标题 -->
<div id="title" class="overlay hidden">
  <h1>植物麻将<small>肉鸽塔防</small></h1>
  <ul class="rules">
    <li>🀄 自动摸牌，凑成 <b>顺子 / 刻子</b> 就能种植物：<b>条</b>=射手　<b>饼</b>=防御　<b>萬</b>=功能　<b>字牌</b>=炸弹</li>
    <li>🔥 手里 8 张凑成 <b>2 面子 + 1 对</b>（或 4 对）就能 <b>胡牌</b>：全场伤害，番数越高越痛</li>
    <li>🧟 共 4 关，第 4 关迎战 <b>铁桶僵尸王</b>；每关结束 <b>三选一强化</b></li>
    <li>⌨️ 点牌选中　Q 组合　X / 右键 打出　H 胡</li>
  </ul>
  <button id="startBtn">开始冒险</button>
  <p class="credit">原项目：David Yang（yangyunhe369）· 新增素材来自 marblexu/PythonPlantsVsZombies</p>
</div>
<div id="draft" class="overlay hidden"></div>
<div id="pause" class="overlay hidden"></div>
<div id="end" class="overlay hidden"></div>

<script src="js/fit.js"></script>
<script src="js/manifest.js"></script>
<script src="js/mahjong.js"></script>
<script src="js/data.js"></script>
<script src="js/assets.js"></script>
<script src="js/audio.js"></script>
<script src="js/entities.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
